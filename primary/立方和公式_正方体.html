<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D降维图解：立方和公式</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1e1e2f; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; user-select: none; }
        #ui-container { position: absolute; top: 20px; left: 20px; background: rgba(30, 30, 46, 0.9); padding: 25px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); pointer-events: auto; backdrop-filter: blur(10px); border: 1px solid #3a3a55; max-width: 400px; z-index: 10; }
        h1 { margin: 0 0 10px 0; font-size: 22px; color: #ff9e64; text-align: center; font-weight: 800; }
        .math-box { background: rgba(0, 0, 0, 0.4); padding: 15px; border-radius: 10px; margin-bottom: 20px; border-left: 4px solid #ff9e64; }
        .math-text { font-size: 14px; color: #c0caf5; margin-bottom: 8px; line-height: 1.6; }
        .math-formula { font-size: 18px; color: #7aa2f7; font-weight: bold; text-align: center; margin-top: 10px; letter-spacing: 1px;}
        
        .control-group { margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px;}
        input[type=range] { flex-grow: 1; margin: 0 15px; accent-color: #ff9e64; cursor: pointer; }
        
        .btn-group { display: flex; flex-direction: column; gap: 10px; }
        button { padding: 12px; font-size: 15px; cursor: pointer; border: none; border-radius: 8px; background: #292e42; color: #c0caf5; font-weight: bold; transition: all 0.3s; text-align: left; padding-left: 20px; border-left: 5px solid transparent; }
        button.active { background: #3d59a1; color: white; border-left: 5px solid #ff9e64; }
        button:hover:not(.active) { background: #414868; }
        
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 20px; color: #ff9e64; display: none; font-weight: bold; background: rgba(0,0,0,0.8); padding: 20px 40px; border-radius: 30px; z-index: 20;}
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

<div id="ui-container">
    <h1>🧊 立方和公式“降维”证明</h1>
    
    <div class="math-box">
        <div class="math-text" id="desc-text">状态 1：图中展示了 n 个立方体，它们的体积分别是 1³、2³、3³... 直到 n³。</div>
        <div class="math-formula" id="formula-text">体积之和 = 1³ + 2³ + ... + n³</div>
    </div>

    <div class="control-group">
        <label style="color:#ff9e64; font-weight:bold;">层数(n): <span id="n-value" style="color:#7aa2f7;font-size:18px;">4</span></label>
        <input type="range" id="n-slider" min="1" max="6" step="1" value="4">
    </div>

    <div class="btn-group">
        <button id="btn-s0" class="active" onclick="goToState(0)">1. 独立的三维立方体</button>
        <button id="btn-s1" onclick="goToState(1)">2. 降维组装成平面大正方形</button>
    </div>
</div>

<div id="loading">正在计算空间拆解坐标...</div>
<div id="canvas-container"></div>

<script>
    // --- 1. 基础场景初始化 ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // 添加辅助网格地面，体现几何归纳的质感
    const gridHelper = new THREE.GridHelper(60, 60, 0x3a3a55, 0x1e1e2f);
    gridHelper.position.y = -0.01;
    scene.add(gridHelper);

    // 灯光设置
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
    dirLight.position.set(20, 40, 20);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    scene.add(dirLight);
    scene.add(new THREE.DirectionalLight(0x88bbff, 0.3).position.set(-20, 20, -20));

    // --- 2. 核心状态与颜色库 ---
    let globalMeshes = [];
    let currentN = 4;
    let currentState = 0;
    
    // 给每一个立方体分配一个鲜艳的独立颜色
    const colors = [
        0xf7768e, // 1 - 红色
        0xff9e64, // 2 - 橙色
        0xe0af68, // 3 - 黄色
        0x9ece6a, // 4 - 绿色
        0x7dcfff, // 5 - 浅蓝
        0xbb9af7  // 6 - 紫色
    ];

    const descriptions = [
        "状态 1：图中展示了独立的立方体。例如紫色的立方体由 4×4×4=64 个小方块组成。",
        "状态 2：奇迹发生！体积为 k³ 的立方体刚好能拆解为一个“L型”包围圈，嵌套前一层的正方形。最终拼成了一个大大的完美正方形！"
    ];

    // --- 3. 数学映射与场景构建 ---
    let baseGroup = new THREE.Group();
    scene.add(baseGroup);

    function buildScene(N) {
        document.getElementById('loading').style.display = 'block';
        
        setTimeout(() => {
            currentN = N;
            
            // 清理旧几何体内存
            globalMeshes.forEach(item => {
                baseGroup.remove(item.mesh);
                item.mesh.geometry.dispose();
                item.mesh.material.dispose();
            });
            globalMeshes = [];

            // 0.94 尺寸是为了让方块之间留有微小的缝隙，更具设计感
            const geo = new THREE.BoxGeometry(0.94, 0.94, 0.94);
            
            // 计算 3D 状态下队列的总宽度，用于居中显示
            let totalWidth = 0;
            for(let i=1; i<=N; i++) totalWidth += i + 1.5; 
            let offsetX = -totalWidth / 2;

            // 最终大正方形的边长 S_n = 1 + 2 + ... + N
            let Sn = (N * (N + 1)) / 2;

            for (let k = 1; k <= N; k++) {
                let mat = new THREE.MeshLambertMaterial({ color: colors[(k-1) % colors.length] });
                
                // 计算 L型(Gnomon) 映射区域
                let S_prev = (k * (k - 1)) / 2;
                let S_curr = (k * (k + 1)) / 2;
                let gnomonSpots = [];
                
                for (let u = 0; u < S_curr; u++) {
                    for (let v = 0; v < S_curr; v++) {
                        // 如果坐标超出了前一个正方形的范围，说明属于当前层的 L 型边缘
                        if (u >= S_prev || v >= S_prev) {
                            gnomonSpots.push(new THREE.Vector3(u - Sn/2 + 0.5, 0.5, v - Sn/2 + 0.5));
                        }
                    }
                }

                let idx = 0;
                for (let x = 0; x < k; x++) {
                    for (let y = 0; y < k; y++) {
                        for (let z = 0; z < k; z++) {
                            let mesh = new THREE.Mesh(geo, mat);
                            mesh.castShadow = true;
                            mesh.receiveShadow = true;
                            baseGroup.add(mesh);

                            // 状态 1：组装成独立的 3D 立方体 (按行排列)
                            let s0Pos = new THREE.Vector3(offsetX + x, y + 0.5, z - k/2);
                            
                            // 状态 2：拆解展平为 2D 的 L 型
                            let s1Pos = gnomonSpots[idx++];

                            globalMeshes.push({
                                mesh: mesh,
                                s0: { pos: s0Pos },
                                s1: { pos: s1Pos }
                            });
                        }
                    }
                }
                offsetX += k + 1.5; // 为下一个立方体腾出间距
            }

            // 自动调整摄像机距离
            camera.position.set(0, Sn * 1.5 + 5, Sn * 1.2 + 8);
            controls.target.set(0, 0, 0);
            
            document.getElementById('loading').style.display = 'none';
            goToState(currentState);
        }, 50); // 极短的延迟用于渲染 Loading 字体
    }

    // --- 4. 动画切换逻辑 ---
    function goToState(stateIdx) {
        currentState = stateIdx;
        
        // 制造“群体飞舞”的效果：使用微小的随机延迟
        globalMeshes.forEach(item => {
            let target = item['s' + stateIdx];
            gsap.to(item.mesh.position, {
                x: target.pos.x, 
                y: target.pos.y, 
                z: target.pos.z, 
                duration: 1.5, 
                ease: "power2.inOut",
                delay: Math.random() * 0.4 // 随机延迟形成颗粒流！
            });
        });

        // UI 反馈
        [0, 1].forEach(i => document.getElementById('btn-s'+i).classList.remove('active'));
        document.getElementById('btn-s'+stateIdx).classList.add('active');
        document.getElementById('desc-text').innerText = descriptions[stateIdx];
        
        const fText = document.getElementById('formula-text');
        if(stateIdx === 0) fText.innerText = `体积之和 = 1³ + 2³ + ... + ${currentN}³`;
        if(stateIdx === 1) fText.innerText = `最终面积 = (1 + 2 + ... + ${currentN})²`;
    }

    // 绑定控制栏
    document.getElementById('n-slider').addEventListener('change', function() {
        document.getElementById('n-value').innerText = this.value;
        buildScene(parseInt(this.value));
    });

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 启动！
    buildScene(4);
    function animate() {
        requestAnimationFrame(animate);
        controls.update(); 
        renderer.render(scene, camera);
    }
    animate();
</script>
</body>
</html>
