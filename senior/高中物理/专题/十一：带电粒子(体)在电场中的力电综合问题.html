<style>
:root{

  --bg-root:radial-gradient(ellipse at 50% 30%,#1e2a4a 0%,#141a2e 60%,#0d1117 100%);
  --bg-surface:rgba(22,33,62,.65);
  --bg-card:rgba(22,33,62,.55);
  --accent:#e94560;
  --accent-dark:#c23152;
  --accent-light:#ff6b8a;
  --accent-glow:rgba(233,69,96,.4);
  --text:#c8ccd4;
  --text-dim:#7a8194;
  --text-muted:#8890a0;
  --border-subtle:rgba(255,255,255,.06);
  --border-accent:rgba(233,69,96,.15);

  --accent-2:rgba(233,69,96,.08);
  --grid-line:rgba(255,255,255,.025);
  --text-strong:#e8eaf0;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  height:100%;display:flex;flex-direction:column;
  overflow:hidden;font-family:"Inter Tight","Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;
  background:var(--bg-root);color:var(--text);
  font-feature-settings:"ss01","cv11";
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

body::before{

  background-size: 160px 160px;
  opacity:.7;
}

/* === TOPBAR - Glass === */
#topbar{
  display:flex;align-items:center;gap:6px;padding:8px 16px;

  flex-shrink:0;z-index:100;overflow-x:auto;white-space:nowrap;
  scrollbar-width:thin;scrollbar-color:rgba(233,69,96,.3) transparent;
  position:relative;
}
#topbar::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg, transparent, rgba(233,69,96,.4), transparent);
  opacity:.7;pointer-events:none;
}
#topbar::-webkit-scrollbar{height:3px}
#topbar::-webkit-scrollbar-track{background:transparent}
#topbar::-webkit-scrollbar-thumb{background:rgba(233,69,96,.3);border-radius:3px}
#topbar button{
  border:none;border-radius:8px;padding:7px 18px;font-size:13px;
  cursor:pointer;transition:all .25s var(--ease-out);
  color:#a0a8b8;background:transparent;font-family:inherit;white-space:nowrap;
  font-weight:500;letter-spacing:.2px;
}
#topbar button:hover{
  background:rgba(233,69,96,.12);color:#fff;
  box-shadow:0 0 12px rgba(233,69,96,.15),inset 0 0 0 1px rgba(233,69,96,.18);
  transform:translateY(-1px);
}
#topbar button[aria-current=true]{
  background:linear-gradient(135deg,var(--accent),var(--accent-dark));

}
#topbar .home-btn{
  font-weight:700;font-size:13px;
  background:rgba(233,69,96,.08);
  color:var(--accent-light);border:1px solid rgba(233,69,96,.22);
  margin-right:8px;
  letter-spacing:.5px;
}
#topbar .home-btn::after{
  content:"";display:inline-block;width:1px;height:18px;
  background:rgba(233,69,96,.25);margin-left:14px;vertical-align:middle;border-radius:1px;
}

  background:rgba(233,69,96,.18);
  box-shadow:0 0 16px rgba(233,69,96,.2);
}
#topbar .home-btn[aria-current=true]{
  background:linear-gradient(135deg,var(--accent),var(--accent-dark));
  color:#fff;border-color:transparent;
  box-shadow:0 2px 16px rgba(233,69,96,.35),inset 0 1px 0 rgba(255,255,255,.18);
}
#status{

}
#status.show{opacity:1}

/* === MAIN === */
#main{flex:1;display:flex;position:relative;min-height:0;z-index:1}
#ggb-container{flex:1;position:relative;overflow:hidden;background:#0d1117}

/* === HOME PANEL === */
#home-panel{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;z-index:10;
  opacity:1;transition:opacity .4s var(--ease-out),transform .4s var(--ease-out);
  overflow-y:auto;padding:60px 24px 64px;
  background:var(--bg-surface);backdrop-filter:blur(16px) saturate(140%);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
}
#home-panel[aria-hidden=true]{opacity:0;transform:scale(.96);pointer-events:none}

#home-panel h1{
  font-family:"Manrope","Noto Sans SC",sans-serif;
  font-size:54px;letter-spacing:4px;font-weight:800;
  margin-bottom:36px;
  background:linear-gradient(135deg,var(--accent-light) 0%,var(--accent) 30%,#ff4473 60%,var(--accent-dark) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 2px 14px var(--accent-glow)) drop-shadow(0 0 32px rgba(233,69,96,.15));
  animation:titleGlow 3.2s ease-in-out infinite alternate;
  text-align:center;
}
@keyframes titleGlow{
  from{filter:drop-shadow(0 2px 14px var(--accent-glow)) drop-shadow(0 0 32px rgba(233,69,96,.15))}
  to  {filter:drop-shadow(0 2px 26px rgba(233,69,96,.55)) drop-shadow(0 0 48px rgba(233,69,96,.25))}
}

/* === TOC === */
.toc{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;max-width:760px;width:100%;
}
.toc [role=button]{
  background:var(--bg-surface);backdrop-filter:blur(16px) saturate(140%);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
  border:1px solid var(--border-subtle);border-radius:14px;
  padding:20px 22px;cursor:pointer;text-align:center;min-width:140px;
  transition:all .3s var(--ease-out);
  box-shadow:var(--shadow-sm),inset 0 1px 0 rgba(255,255,255,.04);
  font-family:inherit;color:inherit;font-size:inherit;
  position:relative;overflow:hidden;
}
.toc [role=button]::before{
  content:"";position:absolute;inset:0;border-radius:14px;padding:1px;
  background:linear-gradient(135deg,transparent 30%,rgba(233,69,96,.4) 50%,transparent 70%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  opacity:0;transition:opacity .3s;pointer-events:none;
}
.toc [role=button]:hover::before,
.toc [role=button]:focus-visible::before{opacity:1}
.toc [role=button]:hover,.toc [role=button]:focus-visible{
  background:rgba(233,69,96,.12);
  border-color:rgba(233,69,96,.35);
  transform:translateY(-4px);
  box-shadow:0 12px 36px rgba(233,69,96,.2),0 0 24px rgba(233,69,96,.08),inset 0 1px 0 rgba(255,255,255,.06);
  outline:none;
}
.toc [role=button]:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.toc-num{
  font-family:"Manrope","JetBrains Mono",monospace;
  font-size:30px;font-weight:800;line-height:1;
  background:linear-gradient(135deg,var(--accent-light),var(--accent));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:8px;letter-spacing:-1px;
  filter:drop-shadow(0 0 12px rgba(233,69,96,.4));
}
.toc-name{
  font-size:12.5px;color:var(--text);letter-spacing:.5px;line-height:1.45;
  font-weight:500;
}

.kbd{

  border-bottom:3px solid rgba(255,255,255,.15);

  font-size:12px;font-family:"JetBrains Mono",monospace;font-weight:500;
  box-shadow:0 2px 0 rgba(0,0,0,.3);

/* === FS BUTTON === */
#fs-btn{

  width:46px;height:46px;border:none;border-radius:14px;
  background:rgba(233,69,96,.2);backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(233,69,96,.25);
  color:#fff;cursor:pointer;font-size:18px;
  display:flex;align-items:center;justify-content:center;
  transition:all .3s var(--ease-out);
  box-shadow:0 4px 20px rgba(0,0,0,.3),0 0 12px rgba(233,69,96,.1),inset 0 1px 0 rgba(255,255,255,.12);
  opacity:1;transform:scale(1);
  font-family:"JetBrains Mono",monospace;
}
#fs-btn:hover{
  background:rgba(233,69,96,.35);
  border-color:rgba(233,69,96,.5);
  transform:scale(1.08) translateY(-3px);
  box-shadow:0 10px 30px rgba(233,69,96,.25),0 0 28px rgba(233,69,96,.15),inset 0 1px 0 rgba(255,255,255,.18);
}
#fs-btn[aria-hidden=true]{opacity:0;transform:scale(.8);pointer-events:none}

/* === LOADING === */
#loading{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:50;
  background:rgba(13,17,23,.92);backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  opacity:1;transition:opacity .35s var(--ease-out);
}
#loading[aria-hidden=true]{opacity:0;pointer-events:none}
.spinner{
  width:46px;height:46px;position:relative;
}
.spinner::before,.spinner::after{
  content:"";position:absolute;inset:0;border-radius:50%;
  border:2px solid transparent;
}
.spinner::before{
  border-top-color:var(--accent);
  border-right-color:var(--accent-light);
  animation:spin .9s cubic-bezier(.6,.2,.4,.8) infinite;
  box-shadow:0 0 18px var(--accent-glow);
}
.spinner::after{
  border-bottom-color:rgba(233,69,96,.3);
  transform:scale(.65);
  animation:spin 1.4s cubic-bezier(.6,.2,.4,.8) infinite reverse;
}
@keyframes spin{to{transform:rotate(360deg)}}
#loading .msg{
  font-family:"JetBrains Mono",monospace;
  font-size:11px;color:var(--text-muted);margin-top:22px;letter-spacing:4px;
  font-weight:500;text-transform:uppercase;
}
#loading .msg::after{
  content:"";display:inline-block;width:3ch;text-align:left;
  animation:dots 1.2s steps(4,end) infinite;
}
@keyframes dots{
  0%, 25%  {content:""}
  25%, 50% {content:"."}
  50%, 75% {content:".."}
  75%, 100%{content:"..."}
}

::selection{background:var(--accent);color:#fff}

/* === 入场动画 === */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
#home-panel > h1, .toc{
  animation:fadeUp .7s var(--ease-out) both;
}
.toc{animation-delay:.2s}
.toc [role=button]{animation:fadeUp .5s var(--ease-out) both}
.toc [role=button]:nth-child(1){animation-delay:.30s}
.toc [role=button]:nth-child(2){animation-delay:.34s}

var topbar=document.getElementById('topbar');
var statusEl=document.getElementById('status');
var toc=document.getElementById('toc');

// === Build TOC ===
(function(){
  DATA.forEach(function(item,i){
    var div=document.createElement('div');
    div.setAttribute('role','button');
    div.setAttribute('tabindex','0');
    div.setAttribute('aria-label',item.name.replace(/<br>/g,''));
    div.innerHTML='<div class="toc-num">'+String(item.num).padStart(2,'0')+'</div><div class="toc-name">'+item.name.replace(/<br>/g,' ')+'</div>';
    div.addEventListener('click',function(){selectFile(i)});
    div.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();selectFile(i)}});
    toc.appendChild(div);
  });
})();

// === Build nav buttons ===
DATA.forEach(function(item,i){
  var btn=document.createElement('button');
  btn.textContent=item.num;
  btn.title=item.name.replace(/<br>/g,' ');
  btn.dataset.idx=i;
  btn.addEventListener('click',function(){selectFile(i)});
  topbar.appendChild(btn);
});

var homeBtn=topbar.querySelector('.home-btn');
homeBtn.addEventListener('click',function(){selectFile(-1)});

var ggbContainer=document.getElementById('ggb-container');
var homePanel=document.getElementById('home-panel');
var loadingEl=document.getElementById('loading');
var fsBtn=document.getElementById('fs-btn');
var currentIdx=-1;
var ggbApplet=null;

function setStatus(msg){statusEl.textContent=msg||'';statusEl.classList.toggle('show',!!msg);}

function selectFile(idx){
  currentIdx=idx;
  var btns=topbar.querySelectorAll('button');
  for(var i=0;i<btns.length;i++){btns[i].removeAttribute('aria-current');}

  if(idx===-1){
    homeBtn.setAttribute('aria-current','true');
    homePanel.setAttribute('aria-hidden','false');
    fsBtn.setAttribute('aria-hidden','true');
    fsBtn.setAttribute('aria-expanded','false');
    setStatus('');
    if(ggbApplet){try{ggbApplet.remove()}catch(e){}}
    ggbContainer.innerHTML='';
    ggbApplet=null;
    return;
  }

  var navBtns=topbar.querySelectorAll('button:not(.home-btn)');
  if(navBtns[idx]) navBtns[idx].setAttribute('aria-current','true');
  homePanel.setAttribute('aria-hidden','true');
  fsBtn.removeAttribute('aria-hidden');
  loadingEl.setAttribute('aria-hidden','false');
  setStatus('加载中');

  if(ggbApplet){try{ggbApplet.remove()}catch(e){}}
  ggbApplet=null;
  ggbContainer.innerHTML='';

  loadGgb(idx);
}

function loadGgb(idx){
  var item=DATA[idx];

  var elId='ggb-'+Date.now();
  var el=document.createElement('div');
  el.id=elId;
  el.style.cssText='width:100%;height:100%';
  ggbContainer.appendChild(el);

  var w=ggbContainer.clientWidth||window.innerWidth;
  var h=ggbContainer.clientHeight||(window.innerHeight-40);

  var perspValue=item.appName==='3d'?'T':'1';

  var params={
    appName:item.appName,
    width:w,
    height:h,
    showToolBar:false,
    showAlgebraInput:false,
    showMenuBar:false,
    showResetIcon:false,
    enableShiftDragZoom:true,
    language:'zh',
    id:elId,
    errorDialogsActive:false,
    ggbBase64:item.b64,
    perspective:perspValue,
    appletOnLoad:function(api){
      loadingEl.setAttribute('aria-hidden','true');
      setStatus('');
      try{
        if(api&&api.setPerspective){
          setTimeout(function(){api.setPerspective(perspValue);},100);
          setTimeout(function(){api.setPerspective(perspValue);},500);
        }
        if(api&&api.evalCommand){
          var cmd=perspValue==='T'?'SetPerspective("T")':'SetPerspective("1")';
          setTimeout(function(){api.evalCommand(cmd);},100);
          setTimeout(function(){api.evalCommand(cmd);},500);
        }
      }catch(e){}
    }
  };

  try{
    var applet=new GGBApplet(params,'5.0');
    ggbApplet=applet;
    requestAnimationFrame(function(){applet.inject(elId);});
  }catch(e){
    loadingEl.setAttribute('aria-hidden','true');
    setStatus('初始化失败');
  }
}

// === Fullscreen ===
fsBtn.addEventListener('click',function(){
  var el=ggbContainer;
  var fs=!!document.fullscreenElement;
  if(el.requestFullscreen){
    fs?document.exitFullscreen():el.requestFullscreen();
  }
  fsBtn.setAttribute('aria-expanded',String(!fs));
});

document.addEventListener('fullscreenchange',function(){
  fsBtn.setAttribute('aria-expanded',String(!!document.fullscreenElement));
});

// === Keyboard ===
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  if(e.key==='Escape'&&currentIdx!==-1){selectFile(-1);return;}
  var num=parseInt(e.key);
  if(num>=1&&num<=DATA.length&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
    selectFile(num-1);
  }
});
})();
</script>
