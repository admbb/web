<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>勾股定理的四种证法</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16/dist/contrib/auto-render.min.js"></script>
<style>
  :root {
    --bg:#f7f8fa; --fg:#1a1a2e; --card:#ffffff; --border:#e0e3eb;
    --accent:#3b82f6; --accent2:#f59e0b; --green:#22c55e; --red:#ef4444;
    --purple:#8b5cf6; --muted:#6b7280; --shadow:0 2px 12px rgba(0,0,0,.06);
  }
  * { box-sizing:border-box; }
  body {
    margin:0; font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--fg); line-height:1.7;
  }
  .wrap { max-width:820px; margin:0 auto; padding:20px 16px 48px; }

  /* 顶部标题 */
  header { text-align:center; margin-bottom:16px; }
  header h1 { margin:0 0 .2rem; font-size:1.5rem; }
  header p { color:var(--muted); margin:0; font-size:.9rem; }

  /* 标签导航 */
  .tabs {
    display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-bottom:16px;
  }
  .tab {
    padding:8px 16px; border-radius:8px; border:1px solid var(--border);
    background:var(--card); cursor:pointer; font-size:.88rem; transition:all .2s;
    color:var(--muted);
  }
  .tab:hover { border-color:var(--accent); color:var(--fg); }
  .tab.active {
    background:var(--accent); color:#fff; border-color:var(--accent);
    box-shadow:var(--shadow);
  }

  /* 交互区 */
  .stage {
    max-width:560px; margin:0 auto;
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:20px; box-shadow:var(--shadow); margin-bottom:16px;
  }
  canvas {
    width:100%; aspect-ratio:5/4; background:#fafbfc;
    border:1px solid var(--border); border-radius:8px; display:block;
  }
  .controls { display:flex; gap:20px; flex-wrap:wrap; margin-top:14px; }
  .controls label { flex:1; min-width:140px; }
  .controls .lbl-text { display:block; color:var(--muted); font-size:.88rem; margin-bottom:4px; }
  .controls .val { color:var(--accent); font-weight:600; }
  input[type=range] { width:100%; accent-color:var(--accent); }

  /* 步骤控制 */
  .steps {
    display:flex; align-items:center; gap:12px; margin-top:14px; flex-wrap:wrap;
  }
  .step-btn {
    padding:6px 16px; border-radius:6px; border:1px solid var(--border);
    background:var(--card); cursor:pointer; font-size:.88rem; transition:all .2s;
  }
  .step-btn:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  .step-btn:disabled { opacity:.4; cursor:not-allowed; }
  .step-info { color:var(--muted); font-size:.85rem; }

  /* 讲解区 */
  .explain {
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:20px 24px; box-shadow:var(--shadow);
  }
  .explain h2 { font-size:1.1rem; margin:0 0 8px; }
  .explain h3 { font-size:1rem; margin:18px 0 6px; color:var(--accent); }
  .explain p { margin:.5rem 0; }
  .formula {
    background:#f0f4f8; border-left:3px solid var(--accent);
    border-radius:6px; padding:10px 16px; margin:10px 0; overflow-x:auto;
  }
  .formula-key {
    background:#fff7ed; border-left:3px solid var(--accent2);
    border-radius:6px; padding:10px 16px; margin:10px 0;
  }
  .proof-title { font-size:1.15rem; font-weight:700; color:var(--accent); margin-bottom:4px; }
  .proof-sub { color:var(--muted); font-size:.88rem; margin-bottom:12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>勾股定理的四种证法</h1>
    <p>拖动 a、b 改变直角三角形形状，点"下一步"逐步揭示证明过程</p>
  </header>

  <!-- 标签导航 -->
  <div class="tabs">
    <button class="tab active" data-proof="0">① 毕达哥拉斯证法</button>
    <button class="tab" data-proof="1">② 赵爽弦图证法</button>
    <button class="tab" data-proof="2">③ 加菲尔德证法</button>
    <button class="tab" data-proof="3">④ 外弦图证法</button>
  </div>

  <!-- 交互区 -->
  <section class="stage">
    <canvas id="c"></canvas>
    <div class="controls">
      <label>
        <span class="lbl-text">直角边 a = <span id="a-val" class="val">3</span></span>
        <input id="a" type="range" min="1" max="6" step="0.5" value="3">
      </label>
      <label>
        <span class="lbl-text">直角边 b = <span id="b-val" class="val">4</span></span>
        <input id="b" type="range" min="1" max="6" step="0.5" value="4">
      </label>
    </div>
    <div class="steps">
      <button class="step-btn" id="prev-step">◀ 上一步</button>
      <button class="step-btn" id="next-step">下一步 ▶</button>
      <span class="step-info" id="step-info">第 1 / 4 步</span>
    </div>
  </section>

  <!-- 讲解区 -->
  <section class="explain" id="explain-area">
    <!-- 内容由 JS 动态填充 -->
  </section>
</div>

<script>
// ============ 全局状态 ============
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const state = {
  a: 3, b: 4,
  proof: 0,    // 0-3 对应四种证法
  step: 0,     // 当前步骤
};

// 四种证法的步骤数
const STEP_COUNTS = [4, 4, 4, 4];

// ============ 工具函数 ============
function dpr() { return window.devicePixelRatio || 1; }

function resize() {
  const rect = cv.getBoundingClientRect();
  cv.width = rect.width * dpr();
  cv.height = rect.height * dpr();
  ctx.setTransform(dpr(), 0, 0, dpr(), 0, 0);
  draw();
}

// 绘制带标签的多边形
function poly(points, fill, stroke, labels) {
  ctx.beginPath();
  ctx.moveTo(points[0][0], points[0][1]);
  for (let i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
  if (labels) {
    ctx.fillStyle = '#333'; ctx.font = '13px system-ui';
    labels.forEach(l => {
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(l.text, l.x, l.y);
    });
  }
}

// 绘制直角标记
function rightAngle(cx, cy, size, dir) {
  ctx.strokeStyle = '#999'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx + size * dir[0], cy + size * dir[1]);
  ctx.lineTo(cx + size * (dir[0] + dir[2]), cy + size * (dir[1] + dir[3]));
  ctx.lineTo(cx + size * dir[2], cy + size * dir[3]);
  ctx.stroke();
}

// 绘制文字
function text(t, x, y, color, size) {
  ctx.fillStyle = color || '#333';
  ctx.font = (size || 14) + 'px system-ui';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(t, x, y);
}

// 绘制面积标注（带背景）
function areaLabel(t, x, y, bg) {
  ctx.font = 'bold 15px system-ui';
  const w = ctx.measureText(t).width + 12;
  ctx.fillStyle = bg || 'rgba(255,255,255,.85)';
  ctx.fillRect(x - w/2, y - 11, w, 22);
  ctx.fillStyle = '#333';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(t, x, y);
}

// ============ 主绘制函数 ============
function draw() {
  const w = cv.clientWidth, h = cv.clientHeight;
  ctx.clearRect(0, 0, w, h);
  if (state.proof === 0) drawPythagoreanV2(w, h);
  else if (state.proof === 1) drawZhaoShuang(w, h);
  else if (state.proof === 2) drawGarfield(w, h);
  else if (state.proof === 3) drawOuterString(w, h);
}

// === 证法1：毕达哥拉斯证法（完全平方和）===
function drawPythagoreanV2(w, h) {
  const a = state.a, b = state.b;
  const c = Math.sqrt(a*a + b*b);
  const s = a + b;
  const scale = Math.min(w / (s * 2.3), h / (s * 1.35));
  const gap = 35;
  const totalW = s * scale * 2 + gap;
  const ox = (w - totalW) / 2;
  const oy = (h - s * scale) / 2;

  const step = state.step;
  const triFill = 'rgba(59,130,246,.15)';
  const triStroke = '#3b82f6';
  const sqA = 'rgba(34,197,94,.2)';   // a² 绿
  const sqB = 'rgba(245,158,11,.2)';  // b² 橙
  const sqC = 'rgba(239,68,68,.2)';   // c² 红

  // ===== 左图 =====
  const lx = ox, ly = oy;
  const L = s * scale;

  // 左图布局：上半(b行)分左a×b(T1+T2)和右b²；下半(a行)分左a²和右b×a(T3+T4)
  // 右图布局：4三角形pinwheel排列，中间c²正方形

  function lpx(x, y) { return [lx + x * scale, ly + y * scale]; }

  // 右图坐标转换
  const rx0 = ox + s * scale + gap, ry0 = oy;
  function rpx(x, y) { return [rx0 + x * scale, ry0 + y * scale]; }

  // === 绘制左图 ===
  // 外框
  ctx.strokeStyle = '#555'; ctx.lineWidth = 2;
  ctx.strokeRect(lx, ly, L, L);
  text('左图', lx + L/2, ly - 14, '#888', 13);

  if (step >= 1) {
    // 4个三角形
    let p;
    p = [lpx(0,0), lpx(a,0), lpx(0,b)]; poly(p, triFill, triStroke);
    p = [lpx(a,0), lpx(a,b), lpx(0,b)]; poly(p, triFill, triStroke);
    p = [lpx(a,b), lpx(s,b), lpx(a,s)]; poly(p, triFill, triStroke);
    p = [lpx(s,b), lpx(s,s), lpx(a,s)]; poly(p, triFill, triStroke);
  }

  if (step >= 2) {
    // a² 和 b² 区域
    p = [lpx(0,b), lpx(a,b), lpx(a,s), lpx(0,s)]; poly(p, sqA, '#22c55e');
    p = [lpx(a,0), lpx(s,0), lpx(s,b), lpx(a,b)]; poly(p, sqB, '#f59e0b');
    // 标注
    let [ax, ay] = lpx(a/2, (b+s)/2); text('a²', ax, ay, '#16a34a', 16);
    let [bx, by] = lpx((a+s)/2, b/2); text('b²', bx, by, '#d97706', 16);
  }

  if (step >= 3) {
    // 标注 (a+b)²
    text('(a+b)² = a² + b² + 4×(½ab)', lx + L/2, ly + L + 22, '#666', 13);
  }

  // === 绘制右图 ===
  ctx.strokeStyle = '#555'; ctx.lineWidth = 2;
  ctx.strokeRect(rx0, ry0, L, L);
  text('右图', rx0 + L/2, ry0 - 14, '#888', 13);

  if (step >= 1) {
    let p;
    p = [rpx(0,0), rpx(b,0), rpx(0,a)]; poly(p, triFill, triStroke);
    p = [rpx(b,0), rpx(s,0), rpx(s,b)]; poly(p, triFill, triStroke);
    p = [rpx(s,b), rpx(s,s), rpx(a,s)]; poly(p, triFill, triStroke);
    p = [rpx(a,s), rpx(0,s), rpx(0,a)]; poly(p, triFill, triStroke);
  }

  if (step >= 2) {
    // c² 中心正方形
    let p = [rpx(b,0), rpx(s,b), rpx(a,s), rpx(0,a)];
    poly(p, sqC, '#ef4444');
    let [cx2, cy2] = [(rpx(b,0)[0]+rpx(a,s)[0])/2, (rpx(b,0)[1]+rpx(a,s)[1])/2];
    text('c²', cx2, cy2, '#dc2626', 16);
  }

  if (step >= 3) {
    text('(a+b)² = c² + 4×(½ab)', rx0 + L/2, ry0 + L + 22, '#666', 13);
  }

  // 底部结论
  if (step >= 3) {
    let cy = Math.max(ly + L + 45, ry0 + L + 45);
    text('两图面积相等 → a² + b² = c²', w/2, cy, '#3b82f6', 15);
  }
}

// === 证法2：赵爽弦图（完全平方差）===
// 大正方形边长c，4个直角三角形斜边贴着四条边，中间剩 |a-b| 小正方形
function drawZhaoShuang(w, h) {
  const a = state.a, b = state.b;
  const c = Math.sqrt(a*a + b*b);
  const scale = Math.min(w / (c * 1.4), h / (c * 1.4));
  const sq = c * scale;
  const ox = (w - sq) / 2;
  const oy = (h - sq) / 2;
  const step = state.step;

  // 数学坐标(y朝上) → 画布坐标(y朝下)
  function px(x, y) { return [ox + x * scale, oy + (c - y) * scale]; }

  // 外正方形四角
  const A = px(0, 0), B = px(c, 0), C = px(c, c), D = px(0, c);

  // 4个三角形直角顶点（pinwheel旋转排列）
  // T1底边AB: 直角在P1, 腿a→A, 腿b→B
  const P1 = px(a*a/c, a*b/c);
  // T2右边BC: 直角在P2, 腿a→B, 腿b→C
  const P2 = px(c - a*b/c, a*a/c);
  // T3顶边CD: 直角在P3
  const P3 = px(c - a*a/c, c - a*b/c);
  // T4左边DA: 直角在P4
  const P4 = px(a*b/c, c - a*a/c);

  const triFill = 'rgba(59,130,246,.15)';
  const triStroke = '#3b82f6';

  // Step 0: 外正方形 + c标注
  if (step >= 0) {
    poly([A, B, C, D], 'rgba(239,68,68,.04)', '#ef4444');
    text('c', (A[0]+B[0])/2, (A[1]+B[1])/2 + 18, '#dc2626', 13);
    text('c', (B[0]+C[0])/2 + 18, (B[1]+C[1])/2, '#dc2626', 13);
    text('c', (C[0]+D[0])/2, (C[1]+D[1])/2 - 18, '#dc2626', 13);
    text('c', (D[0]+A[0])/2 - 18, (D[1]+A[1])/2, '#dc2626', 13);
  }

  // Step 1: 4个三角形
  if (step >= 1) {
    poly([A, B, P1], triFill, triStroke);
    poly([B, C, P2], triFill, triStroke);
    poly([C, D, P3], triFill, triStroke);
    poly([D, A, P4], triFill, triStroke);

    // 直角标记
    rightAngle(P1[0], P1[1], 10, [-a/c, b/c, b/c, a/c]);
    rightAngle(P2[0], P2[1], 10, [b/c, a/c, a/c, -b/c]);
    rightAngle(P3[0], P3[1], 10, [a/c, -b/c, -b/c, -a/c]);
    rightAngle(P4[0], P4[1], 10, [-b/c, -a/c, -a/c, b/c]);

    // 腿标注（T1底 + T2右 作代表）
    text('a', (A[0]+P1[0])/2 - 12, (A[1]+P1[1])/2 + 5, '#3b82f6', 12);
    text('b', (B[0]+P1[0])/2 + 12, (B[1]+P1[1])/2 + 5, '#3b82f6', 12);
    text('a', (B[0]+P2[0])/2 + 14, (B[1]+P2[1])/2 - 3, '#3b82f6', 12);
    text('b', (C[0]+P2[0])/2 + 14, (C[1]+P2[1])/2 - 3, '#3b82f6', 12);
  }

  // Step 2: 中间小正方形 (a-b)²
  if (step >= 2) {
    poly([P1, P2, P3, P4], 'rgba(245,158,11,.22)', '#f59e0b');
    const cx = (P1[0]+P3[0])/2, cy = (P1[1]+P3[1])/2;
    areaLabel('(a−b)²', cx, cy, 'rgba(255,255,255,.9)');
    const mx = (P1[0]+P2[0])/2, my = (P1[1]+P2[1])/2;
    text('|a−b|', mx + 16, my - 8, '#d97706', 11);
  }

  // Step 3: 等式
  if (step >= 3) {
    text('c² = 4×(½ab) + (a−b)² = 2ab + a²−2ab+b² = a²+b²', w/2, h - 14, '#3b82f6', 13);
  }
}

// === 证法3：加菲尔德证法 ===
function drawGarfield(w, h) {
  const a = state.a, b = state.b;
  const c = Math.sqrt(a*a + b*b);
  const s = a + b;
  const scale = Math.min(w / (s * 1.4), h / (s * 1.3));
  const ox = w / 2 - s * scale / 2;
  const oy = h / 2 - s * scale / 2;
  const step = state.step;

  function px(x, y) { return [ox + x * scale, oy + y * scale]; }



  // 绘制
  const triFill = 'rgba(59,130,246,.15)';
  const triStroke = '#3b82f6';
  const isoFill = 'rgba(239,68,68,.12)';
  const isoStroke = '#ef4444';

  // 梯形外框
  let trap = [px(0,0), px(s,0), px(s,a), px(0,b)];
  ctx.strokeStyle = '#555'; ctx.lineWidth = 2;
  poly(trap, null, '#555');

  if (step >= 1) {
    // T1
    poly([px(0,0), px(a,0), px(0,b)], triFill, triStroke);
    text('½ab', px(a/3, b/3)[0], px(a/3, b/3)[1], '#3b82f6', 12);
  }
  if (step >= 2) {
    // T2
    poly([px(s,0), px(a,0), px(s,a)], triFill, triStroke);
    // T3 (等腰直角)
    poly([px(a,0), px(0,b), px(s,a)], isoFill, isoStroke);
    text('½c²', px((a+0+s)/3, (0+b+a)/3)[0], px((a+0+s)/3, (0+b+a)/3)[1], '#dc2626', 12);
  }
  if (step >= 3) {
    // 标注边长
    text('a', px(a/2, 0)[0], px(a/2, 0)[1]+14, '#666', 13);
    text('b', px((a+s)/2, 0)[0], px((a+s)/2, 0)[1]+14, '#666', 13);
    text('b', px(0, b/2)[0]-14, px(0, b/2)[1], '#666', 13);
    text('a', px(s, a/2)[0]+14, px(s, a/2)[1], '#666', 13);
    
    // 结论
    text('梯形面积 = (a+b)²/2 = ab + ½c²  →  a²+b² = c²', w/2, h-18, '#3b82f6', 14);
  }
}

// === 证法4：外弦图证法 ===
function drawOuterString(w, h) {
  const a = state.a, b = state.b;
  const c = Math.sqrt(a*a + b*b);
  const s = a + b;
  const scale = Math.min(w / (s * 1.3), h / (s * 1.25));
  const ox = w / 2, oy = h / 2;
  const step = state.step;

  // 外弦图：大正方形边长(a+b)，内嵌4个三角形和1个c²正方形
  // 与赵爽弦图（内弦图）互补：
  // 内弦图：大正方形边c，4三角形在内，中间小正方形(a-b)²
  // 外弦图：大正方形边(a+b)，4三角形在外围，中间正方形c²
  

  const half = s * scale / 2;
  const cx = ox, cy = oy;

  function px(x, y) { return [cx - half + x * scale, cy - half + y * scale]; }

  const triFill = 'rgba(59,130,246,.15)';
  const triStroke = '#3b82f6';
  const sqC = 'rgba(239,68,68,.12)';

  // 大正方形
  poly([px(0,0), px(s,0), px(s,s), px(0,s)], null, '#555');
  text('(a+b)²', cx, cy - half - 14, '#888', 13);

  if (step >= 1) {
    // 4个三角形
    poly([px(0,0), px(b,0), px(0,a)], triFill, triStroke);
    poly([px(s,0), px(b,0), px(s,b)], triFill, triStroke);
    poly([px(s,s), px(a,s), px(s,b)], triFill, triStroke);
    poly([px(0,s), px(a,s), px(0,a)], triFill, triStroke);
  }

  if (step >= 2) {
    // c² 正方形
    poly([px(b,0), px(s,b), px(a,s), px(0,a)], sqC, '#ef4444');
    text('c²', cx, cy, '#dc2626', 18);
    
    // 三角形面积标注
    text('½ab', (px(0,0)[0]+px(b,0)[0]+px(0,a)[0])/3, (px(0,0)[1]+px(b,0)[1]+px(0,a)[1])/3, '#3b82f6', 11);
  }

  if (step >= 3) {
    // 边长标注
    text('a', px(b/2, 0)[0], px(b/2, 0)[1]-12, '#666', 12);
    text('b', px((b+s)/2, 0)[0], px((b+s)/2, 0)[1]-12, '#666', 12);
    
    text('(a+b)² = c² + 4×(½ab) = c² + 2ab  →  a²+b² = c²', w/2, h-18, '#3b82f6', 14);
  }
}

// ============ 步骤管理 ============
function updateStepInfo() {
  const max = STEP_COUNTS[state.proof];
  document.getElementById('step-info').textContent = `第 ${state.step + 1} / ${max} 步`;
  document.getElementById('prev-step').disabled = state.step === 0;
  document.getElementById('next-step').disabled = state.step === max - 1;
}

function updateExplain() {
  const explanations = [
    // 证法1：毕达哥拉斯
    `<div class="proof-title">① 毕达哥拉斯证法 — 完全平方和</div>
     <div class="proof-sub">利用 $(a+b)^2 = a^2 + 2ab + b^2$ 展开式，通过面积割补证明</div>
     <h3>思路</h3>
     <p>画两个同样大小的正方形，边长都是 $a+b$。</p>
     <p>左图：4个直角三角形围在四角，剩余面积恰好是 $a^2 + b^2$。</p>
     <p>右图：同样4个三角形旋转排列（风车形），剩余面积恰好是 $c^2$。</p>
     <div class="formula-key">两个正方形面积相等：$(a+b)^2 = a^2 + b^2 + 4 \\times \\frac{ab}{2} = c^2 + 4 \\times \\frac{ab}{2}$</div>
     <div class="formula">$$a^2 + b^2 + 2ab = c^2 + 2ab \\quad \\Rightarrow \\quad a^2 + b^2 = c^2$$</div>
     <p style="color:var(--muted)">关键：两图三角形总面积相同（都是 $2ab$），减去后剩余面积必然相等。</p>`,
    // 证法2：赵爽弦图
    `<div class="proof-title">② 赵爽弦图证法 — 完全平方差</div>
     <div class="proof-sub">利用 $(a-b)^2 = a^2 - 2ab + b^2$ 展开式，中国古代经典证法</div>
     <h3>思路</h3>
     <p>画一个边长为 $c$ 的大正方形，4个直角三角形的斜边分别贴着大正方形的四条边。</p>
     <p>4个三角形的斜边朝外，围成大正方形的四条边。</p>
     <p>中间剩余一个小正方形，边长为 $|a-b|$。</p>
     <div class="formula-key">大正方形面积 = 4个三角形 + 小正方形：</div>
     <div class="formula">$$c^2 = 4 \\times \\frac{ab}{2} + (a-b)^2 = 2ab + a^2 - 2ab + b^2 = a^2 + b^2$$</div>
     <p style="color:var(--muted)">关键：完全平方差 $(a-b)^2 = a^2 - 2ab + b^2$ 恰好消去 $2ab$。</p>`,
    // 证法3：加菲尔德
    `<div class="proof-title">③ 加菲尔德证法 — 梯形面积法</div>
     <div class="proof-sub">美国第20任总统加菲尔德发明，利用直角梯形面积</div>
     <h3>思路</h3>
     <p>用两个全等直角三角形（腿 $a, b$）和一个等腰直角三角形（腿 $c$）拼成一个直角梯形。</p>
     <p>梯形左右两边分别长 $b$ 和 $a$，底边长 $a+b$。</p>
     <div class="formula-key">梯形面积 = 整体法 - 分块法：</div>
     <div class="formula">$$\\frac{(a+b)^2}{2} = \\frac{ab}{2} + \\frac{ab}{2} + \\frac{c^2}{2} = ab + \\frac{c^2}{2}$$</div>
     <div class="formula">$$\\frac{a^2 + 2ab + b^2}{2} = ab + \\frac{c^2}{2} \\quad \\Rightarrow \\quad a^2 + b^2 = c^2$$</div>
     <p style="color:var(--muted)">关键：两个三角形斜边互相垂直（方向向量点积为0），中间三角形确为等腰直角三角形。</p>`,
    // 证法4：外弦图
    `<div class="proof-title">④ 外弦图证法 — 赵爽弦图扩展</div>
     <div class="proof-sub">赵爽弦图的互补版本，利用 $(a+b)^2$ 完全平方和</div>
     <h3>思路</h3>
     <p>赵爽弦图（内弦图）：大正方形边长 $c$，4个三角形在内，中间小正方形 $(a-b)^2$。</p>
     <p>外弦图：大正方形边长 $a+b$，4个三角形在外围，中间正方形 $c^2$。</p>
     <div class="formula-key">大正方形面积 = c² 正方形 + 4个三角形：</div>
     <div class="formula">$$(a+b)^2 = c^2 + 4 \\times \\frac{ab}{2} = c^2 + 2ab$$</div>
     <div class="formula">$$a^2 + 2ab + b^2 = c^2 + 2ab \\quad \\Rightarrow \\quad a^2 + b^2 = c^2$$</div>
     <p style="color:var(--muted)">关键：内弦图用 $(a-b)^2$ 消去 $-2ab$，外弦图用 $(a+b)^2$ 消去 $+2ab$，殊途同归。</p>`,
  ];
  document.getElementById('explain-area').innerHTML = explanations[state.proof];
  if (window.renderMathInElement) {
    renderMathInElement(document.getElementById('explain-area'), {
      delimiters: [{left:'$$',right:'$$',display:true}, {left:'$',right:'$',display:false}]
    });
  }
}

// ============ 事件绑定 ============
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    state.proof = parseInt(tab.dataset.proof);
    state.step = 0;
    updateStepInfo();
    updateExplain();
    draw();
  });
});

document.getElementById('next-step').addEventListener('click', () => {
  const max = STEP_COUNTS[state.proof];
  if (state.step < max - 1) { state.step++; updateStepInfo(); draw(); }
});
document.getElementById('prev-step').addEventListener('click', () => {
  if (state.step > 0) { state.step--; updateStepInfo(); draw(); }
});

function bindSlider(id, key) {
  const el = document.getElementById(id), out = document.getElementById(id + '-val');
  const update = () => {
    state[key] = parseFloat(el.value);
    out.textContent = el.value;
    draw();
  };
  el.addEventListener('input', update);
}

window.addEventListener('resize', resize);
window.addEventListener('load', () => {
  if (window.renderMathInElement) {
    renderMathInElement(document.body, {
      delimiters: [{left:'$$',right:'$$',display:true}, {left:'$',right:'$',display:false}]
    });
  }
  bindSlider('a', 'a');
  bindSlider('b', 'b');
  updateStepInfo();
  updateExplain();
  resize();
});
</script>
</body>
</html>
