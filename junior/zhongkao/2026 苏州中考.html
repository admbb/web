<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>2026 苏州中考</title>
<meta name="description" content="2026 苏州中考 GeoGebra 几何动态演示合集，包含16_1、16_2、16_3、16_4、25_2、25_2_1、25_2_2、25_2_3、26、8、8_1、8_2，支持交互式浏览和全屏查看。">

<style>
:root{
  --bg-root:radial-gradient(ellipse at 50% 30%,#1e2a4a 0%,#141a2e 60%,#0d1117 100%);
  --bg-surface:rgba(22,33,62,.65);
  --bg-card:rgba(22,33,62,.55);
  --accent:#e94560;
  --accent-dark:#c23152;
  --accent-light:#ff6b8a;
  --accent-glow:rgba(233,69,96,.4);
  --text:#c8ccd4;
  --text-dim:#7a8194;
  --text-muted:#8890a0;
  --border-subtle:rgba(255,255,255,.06);
  --border-accent:rgba(233,69,96,.15);
  --shadow-sm:0 4px 20px rgba(0,0,0,.2);
  --ease-out:cubic-bezier(.4,0,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  height:100%;display:flex;flex-direction:column;
  overflow:hidden;font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  background:var(--bg-root);color:var(--text);
}

/* === TOPBAR - Glass === */
#topbar{
  display:flex;align-items:center;gap:6px;padding:8px 16px;
  background:var(--bg-surface);backdrop-filter:blur(16px) saturate(140%);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
  border-bottom:1px solid var(--border-accent);
  box-shadow:0 1px 20px rgba(0,0,0,.25),0 0 30px rgba(233,69,96,.04);
  flex-shrink:0;z-index:100;overflow-x:auto;white-space:nowrap;
  scrollbar-width:thin;scrollbar-color:rgba(233,69,96,.3) transparent;
}
#topbar::-webkit-scrollbar{height:3px}
#topbar::-webkit-scrollbar-track{background:transparent}
#topbar::-webkit-scrollbar-thumb{background:rgba(233,69,96,.3);border-radius:3px}
#topbar button{
  border:none;border-radius:8px;padding:7px 18px;font-size:13px;
  cursor:pointer;transition:all .25s var(--ease-out);
  color:#a0a8b8;background:transparent;font-family:inherit;white-space:nowrap;
}
#topbar button:hover{
  background:rgba(233,69,96,.12);color:#fff;
  box-shadow:0 0 12px rgba(233,69,96,.15);transform:translateY(-1px);
}
#topbar button[aria-current=true]{
  background:linear-gradient(135deg,var(--accent),var(--accent-dark));
  color:#fff;box-shadow:0 2px 16px rgba(233,69,96,.35);
}
#topbar .home-btn{
  font-weight:700;font-size:14px;
  background:rgba(233,69,96,.08);
  color:var(--accent);border:1px solid rgba(233,69,96,.2);
  margin-right:8px;
}
#topbar .home-btn::after{
  content:"";display:inline-block;width:1px;height:18px;
  background:rgba(233,69,96,.18);margin-left:14px;vertical-align:middle;border-radius:1px;
}
#topbar .home-btn:hover{
  background:rgba(233,69,96,.18);
  box-shadow:0 0 16px rgba(233,69,96,.2);
}
#topbar .home-btn[aria-current=true]{
  background:linear-gradient(135deg,var(--accent),var(--accent-dark));
  color:#fff;border-color:transparent;
}
#status{font-size:11px;color:var(--accent);margin-left:10px;flex-shrink:0;opacity:0;transition:opacity .3s}
#status.show{opacity:1}

/* === MAIN === */
#main{flex:1;display:flex;position:relative;min-height:0}
#ggb-container{flex:1;position:relative;overflow:hidden}

/* === HOME PANEL === */
#home-panel{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:10;
  opacity:1;transition:opacity .4s var(--ease-out),transform .4s var(--ease-out);
  overflow-y:auto;padding:30px 20px;
}
#home-panel[aria-hidden=true]{opacity:0;transform:scale(.96);pointer-events:none}

#home-panel h1{
  font-size:46px;margin-bottom:8px;letter-spacing:6px;font-weight:800;
  background:linear-gradient(135deg,var(--accent-light) 0%,var(--accent) 30%,#ff4473 60%,var(--accent-dark) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 2px 12px var(--accent-glow));
  animation:titleGlow 3s ease-in-out infinite alternate;
}
@keyframes titleGlow{
  from{filter:drop-shadow(0 2px 12px var(--accent-glow))}
  to{filter:drop-shadow(0 2px 24px var(--accent-glow))}
}

/* === TOC === */
.toc{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;max-width:720px;
}
.toc [role=button]{
  background:var(--bg-card);backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid var(--border-subtle);border-radius:12px;
  padding:18px 28px;cursor:pointer;text-align:center;min-width:130px;
  transition:all .3s var(--ease-out);
  box-shadow:var(--shadow-sm);font-family:inherit;color:inherit;font-size:inherit;
}
.toc [role=button]:hover,.toc [role=button]:focus-visible{
  background:rgba(233,69,96,.1);
  border-color:rgba(233,69,96,.3);
  transform:translateY(-4px);
  box-shadow:0 8px 32px rgba(233,69,96,.15),0 0 20px rgba(233,69,96,.05);
  outline:none;
}
.toc [role=button]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toc-num{
  font-size:28px;font-weight:800;
  background:linear-gradient(135deg,var(--accent),var(--accent-light));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:4px;
}
.toc-name{font-size:12px;color:var(--text-muted);letter-spacing:1px}

/* === KBD === */
.kbd{
  display:inline-block;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  border-bottom:3px solid rgba(255,255,255,.15);
  border-radius:5px;color:#bcc2d0;padding:3px 9px;margin:0 2px;
  font-size:12px;font-family:inherit;
  box-shadow:0 2px 0 rgba(0,0,0,.3);
}

/* === FS BUTTON === */
#fs-btn{
  position:fixed;bottom:24px;right:24px;z-index:200;
  width:46px;height:46px;border:none;border-radius:14px;
  background:rgba(233,69,96,.2);backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(233,69,96,.2);
  color:#fff;cursor:pointer;font-size:18px;
  display:flex;align-items:center;justify-content:center;
  transition:all .3s var(--ease-out);
  box-shadow:0 4px 20px rgba(0,0,0,.3),0 0 12px rgba(233,69,96,.08);
  opacity:1;transform:scale(1);
}
#fs-btn:hover{
  background:rgba(233,69,96,.35);
  border-color:rgba(233,69,96,.5);
  transform:scale(1.08) translateY(-3px);
  box-shadow:0 8px 28px rgba(233,69,96,.2),0 0 24px rgba(233,69,96,.12);
}
#fs-btn[aria-hidden=true]{opacity:0;transform:scale(.8);pointer-events:none}

/* === LOADING === */
#loading{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:50;
  background:rgba(13,17,23,.85);backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  opacity:1;transition:opacity .35s var(--ease-out);
}
#loading[aria-hidden=true]{opacity:0;pointer-events:none}
.spinner{
  width:44px;height:44px;border:3px solid rgba(233,69,96,.12);
  border-top-color:var(--accent);border-radius:50%;
  animation:spin .7s cubic-bezier(.6,.2,.4,.8) infinite;
  box-shadow:0 0 16px rgba(233,69,96,.2);
}
@keyframes spin{to{transform:rotate(360deg)}}
#loading .msg{font-size:13px;color:#6a7180;margin-top:18px;letter-spacing:2px}

::selection{background:var(--accent);color:#fff}
</style>
</head>

var topbar=document.getElementById('topbar');
var statusEl=document.getElementById('status');
var toc=document.getElementById('toc');

// Build TOC (no grouping, matches 贺题目.html / 鼓楼区七年级期末.html)
(function(){
  DATA.forEach(function(item,i){
    var div=document.createElement('div');
    div.setAttribute('role','button');
    div.setAttribute('tabindex','0');
    div.setAttribute('aria-label',item.name.replace(/<br>/g,''));
    div.innerHTML='<div class="toc-num">'+item.num+'</div><div class="toc-name">'+item.name.replace(/<br>/g,' ')+'</div>';
    div.addEventListener('click',function(){selectFile(i)});
    div.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();selectFile(i)}});
    toc.appendChild(div);
  });
})();

// Build nav buttons
DATA.forEach(function(item,i){
  var btn=document.createElement('button');
  btn.textContent=item.num;
  btn.title=item.name.replace(/<br>/g,' ');
  btn.dataset.idx=i;
  btn.addEventListener('click',function(){selectFile(i)});
  topbar.appendChild(btn);
});

var homeBtn=topbar.querySelector('.home-btn');
homeBtn.addEventListener('click',function(){selectFile(-1)});

var ggbContainer=document.getElementById('ggb-container');
var homePanel=document.getElementById('home-panel');
var loadingEl=document.getElementById('loading');
var fsBtn=document.getElementById('fs-btn');
var currentIdx=-1;
var ggbApplet=null;

function setStatus(msg){statusEl.textContent=msg||'';statusEl.classList.toggle('show',!!msg);}

function selectFile(idx){
  currentIdx=idx;
  var btns=topbar.querySelectorAll('button');
  for(var i=0;i<btns.length;i++){btns[i].removeAttribute('aria-current');}

  if(idx===-1){
    homeBtn.setAttribute('aria-current','true');
    homePanel.setAttribute('aria-hidden','false');
    fsBtn.setAttribute('aria-hidden','true');
    fsBtn.setAttribute('aria-expanded','false');
    setStatus('');
    if(ggbApplet){try{ggbApplet.remove()}catch(e){}}
    ggbContainer.innerHTML='';
    ggbApplet=null;
    return;
  }

  var navBtns=topbar.querySelectorAll('button:not(.home-btn)');
  if(navBtns[idx]) navBtns[idx].setAttribute('aria-current','true');
  homePanel.setAttribute('aria-hidden','true');
  fsBtn.removeAttribute('aria-hidden');
  loadingEl.setAttribute('aria-hidden','false');
  setStatus('加载中...');

  if(ggbApplet){try{ggbApplet.remove()}catch(e){}}
  ggbApplet=null;
  ggbContainer.innerHTML='';

  loadGgb(idx);
}

function loadGgb(idx){
  var item=DATA[idx];

  var elId='ggb-'+Date.now();
  var el=document.createElement('div');
  el.id=elId;
  el.style.cssText='width:100%;height:100%';
  ggbContainer.appendChild(el);

  var w=ggbContainer.clientWidth||window.innerWidth;
  var h=ggbContainer.clientHeight||(window.innerHeight-40);

  // perspective: "T" = pure 3D view (no Algebra panel)
  // perspective: "1" = Graphics View only (2D), no Algebra panel
  var perspValue=item.appName==='3d'?'T':'1';

  var params={
    appName:item.appName,
    width:w,
    height:h,
    showToolBar:false,
    showAlgebraInput:false,
    showMenuBar:false,
    showResetIcon:false,
    enableShiftDragZoom:true,
    language:'zh',
    id:elId,
    errorDialogsActive:false,
    ggbBase64:item.b64,
    perspective:perspValue,
    appletOnLoad:function(api){
      loadingEl.setAttribute('aria-hidden','true');
      setStatus('');
      // ggbBase64 内部视图配置会覆盖 params.perspective
      // 必须用多种方式强行设置，确保代数区被隐藏
      try{
        // 方法1: JS API —— setPerspective
        if(api&&api.setPerspective){
          setTimeout(function(){api.setPerspective(perspValue);},100);
          setTimeout(function(){api.setPerspective(perspValue);},500);
        }
        // 方法2: 内部命令引擎 —— evalCommand（双重保险，权限更高）
        // evalCommand 直接把指令送到 GeoGebra 最核心的代数运算引擎
        // 通常能压制住所有乱跑的 UI 状态
        if(api&&api.evalCommand){
          var cmd=perspValue==='T'?'SetPerspective("T")':'SetPerspective("1")';
          setTimeout(function(){api.evalCommand(cmd);},100);
          setTimeout(function(){api.evalCommand(cmd);},500);
        }
      }catch(e){}
    }
  };

  try{
    var applet=new GGBApplet(params,'5.0');
    ggbApplet=applet;
    requestAnimationFrame(function(){applet.inject(elId);});
  }catch(e){
    loadingEl.setAttribute('aria-hidden','true');
    setStatus('初始化失败');
  }
}

// Fullscreen
fsBtn.addEventListener('click',function(){
  var el=ggbContainer;
  var fs=!!document.fullscreenElement;
  if(el.requestFullscreen){
    fs?document.exitFullscreen():el.requestFullscreen();
  }
  fsBtn.setAttribute('aria-expanded',String(!fs));
});

document.addEventListener('fullscreenchange',function(){
  fsBtn.setAttribute('aria-expanded',String(!!document.fullscreenElement));
});

// Keyboard
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  if(e.key==='Escape'&&currentIdx!==-1){selectFile(-1);return;}
  var num=parseInt(e.key);
  if(num>=1&&num<=DATA.length&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
    selectFile(num-1);
  }
});
</script>
